<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>V.O System</title>
  <style>
    body {
      margin: 0;
      background-image: url('./haikei.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      touch-action: none;
    }

    /* 1. パスワード確認ダイアログ */
    #startupDialog {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      background-image: url('./v.o System2.png');
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 200;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .startup-box {
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid #00f0ff;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.5);
      border-radius: 16px;
      padding: 30px 40px;
      text-align: center;
      color: #fff;
      font-family: sans-serif;
      max-width: 80vw;
    }

    .startup-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    .password-input {
      width: 80%;
      padding: 12px;
      font-size: 18px;
      text-align: center;
      border: 2px solid #00f0ff;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      outline: none;
      margin-bottom: 12px;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
    }

    .password-error {
      color: #ff4d4d;
      font-size: 14px;
      height: 20px;
      margin-bottom: 12px;
      font-weight: bold;
    }

    .launch-btn {
      padding: 12px 32px;
      font-size: 18px;
      font-weight: bold;
      color: #00f0ff;
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid #00f0ff;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
    }

    .launch-btn:active {
      background: #00f0ff;
      color: #000;
      transform: scale(0.95);
    }

    /* 2. 起動画面（スプラッシュ画面） */
    #splashScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      background-image: url('./v.o System.png');
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 100;
      display: none;
      opacity: 1;
      transition: opacity 0.8s ease;
    }

    canvas {
      background-color: transparent;
      max-width: 100vw;
      max-height: 100vh;
      touch-action: none;
    }

    .ui-container {
      position: absolute;
      top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }

    .btn {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid #fff;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .btn:active {
      transform: scale(0.95);
    }

    #status {
      color: white;
      background: rgba(0,0,0,0.6);
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 14px;
      pointer-events: none;
      text-align: center;
    }
  </style>
</head>
<body>

<!-- 1. パスワード確認ダイアログ -->
<div id="startupDialog">
  <div class="startup-box">
    <div class="startup-title">パスワードを入力してください</div>
    <input type="password" id="passInput" class="password-input" placeholder="Password" maxlength="10">
    <div id="passError" class="password-error"></div>
    <button class="launch-btn" id="launchBtn">システム起動</button>
  </div>
</div>

<!-- 2. 起動画面（v.o System.png） -->
<div id="splashScreen"></div>

<div class="ui-container">
  <button class="btn" id="startBtn">音声認識＆センサー開始</button>
  <div id="status">状態: 停止中（ボタンを押してください）</div>
</div>

<canvas id="vtuberCanvas"></canvas>

<script>
const startAudio = new Audio('./system_start.wav');
const clickAudio = new Audio('./fx.wav');

const startupDialog = document.getElementById('startupDialog');
const splashScreen = document.getElementById('splashScreen');
const launchBtn = document.getElementById('launchBtn');
const passInput = document.getElementById('passInput');
const passError = document.getElementById('passError');

function checkPasswordAndLaunch() {
  clickAudio.currentTime = 0;
  clickAudio.play().catch(err => console.log('SE再生エラー:', err));

  if (passInput.value === '036') {
    passError.textContent = '';
    startupDialog.style.display = 'none';
    splashScreen.style.display = 'block';

    startAudio.play().catch(err => console.log('音声再生エラー:', err));

    setTimeout(() => {
      splashScreen.style.opacity = '0';
      setTimeout(() => {
        splashScreen.style.display = 'none';
      }, 800);
    }, 8000);
  } else {
    passError.textContent = 'パスワードが違います';
    passInput.value = '';
  }
}

launchBtn.addEventListener('click', checkPasswordAndLaunch);
passInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') {
    checkPasswordAndLaunch();
  }
});

const canvas = document.getElementById('vtuberCanvas');
const ctx = canvas.getContext('2d');

let offsetX = 0;
let offsetY = 0;

// --- 1. ボイス30個の読み込み ＆ 過去3回履歴管理 ---
const TOTAL_VOICES = 30;
const voiceSources = [];
for (let i = 1; i <= TOTAL_VOICES; i++) {
  voiceSources.push(`./voice${i}.wav`);
}

const voices = voiceSources.map(src => new Audio(src));
let currentVoice = null;
let historyIndices = [];
let isSpeaking = false;

// --- 2. 音声認識＆ジャイロ ---
const startBtn = document.getElementById('startBtn');
const statusDiv = document.getElementById('status');
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

let recognition = null;

startBtn.addEventListener('click', () => {
  clickAudio.currentTime = 0;
  clickAudio.play().catch(() => {});

  if (typeof window.DeviceOrientationEvent !== 'undefined') {
    window.addEventListener('deviceorientation', (e) => {
      const gamma = e.gamma || 0;
      const beta = e.beta || 0;
      offsetX = Math.min(Math.max(gamma / 30, -1), 1);
      offsetY = Math.min(Math.max((beta - 45) / 30, -1), 1);
    });
  }

  if (!SpeechRecognition) {
    statusDiv.textContent = 'エラー: お使いのブラウザは音声認識非対応です';
    return;
  }

  startBtn.style.display = 'none';
  initSpeechRecognition();
});

function initSpeechRecognition() {
  recognition = new SpeechRecognition();
  recognition.lang = 'ja-JP';
  recognition.continuous = true;
  recognition.interimResults = false;

  recognition.onstart = () => {
    if (!isSpeaking) {
      statusDiv.textContent = '話しかけてね';
      statusDiv.style.background = 'rgba(0, 150, 0, 0.6)';
    }
  };

  recognition.onresult = (event) => {
    if (isSpeaking) return;

    const results = event.results;
    for (let i = event.resultIndex; i < results.length; i++) {
      if (results[i].isFinal) {
        playRandomVoice();
      }
    }
  };

  recognition.onerror = (e) => {
    console.warn('音声認識通知:', e.error);
  };

  recognition.onend = () => {
    if (!isSpeaking) {
      setTimeout(() => {
        try {
          recognition.start();
        } catch (err) {}
      }, 300);
    }
  };

  try {
    recognition.start();
  } catch (e) {
    console.error(e);
  }
}

function playRandomVoice() {
  isSpeaking = true;
  try { recognition.stop(); } catch(e) {}

  if (currentVoice) {
    currentVoice.pause();
    currentVoice.currentTime = 0;
  }

  const availableIndices = [];
  for (let i = 0; i < voices.length; i++) {
    if (!historyIndices.includes(i)) {
      availableIndices.push(i);
    }
  }

  const pool = availableIndices.length > 0 ? availableIndices : Array.from({length: voices.length}, (_, i) => i);
  const randomIndex = pool[Math.floor(Math.random() * pool.length)];

  historyIndices.push(randomIndex);
  if (historyIndices.length > 3) {
    historyIndices.shift();
  }

  currentVoice = voices[randomIndex];

  statusDiv.textContent = '再生中...';
  statusDiv.style.background = 'rgba(0, 100, 200, 0.6)';

  currentVoice.onended = () => {
    isSpeaking = false;
    statusDiv.textContent = '話しかけてね';
    statusDiv.style.background = 'rgba(0, 150, 0, 0.6)';
    try { recognition.start(); } catch(e) {}
  };

  currentVoice.play().catch(err => {
    console.log('ボイス再生エラー:', err);
    isSpeaking = false;
    try { recognition.start(); } catch(e) {}
  });
}

// PC用マウスフォールバック
window.addEventListener('mousemove', (e) => {
  if (startBtn.style.display !== 'none') return;
  const rect = canvas.getBoundingClientRect();
  offsetX = ((e.clientX - rect.left) - canvas.width / 2) / (canvas.width / 2);
  offsetY = ((e.clientY - rect.top) - canvas.height / 2) / (canvas.height / 2);
});

// --- 画像描画ループ ---
const images = {};
const sources = {
  h: './h.png',    // 通常・目開き・口開き
  h2: './h2.png',  // 目開き・口閉じ
  h3: './h3.png',  // 待機用まばたき（目閉じ・口開き）
  h4: './h4.png',  // 再生用まばたき（目閉じ・口閉じ）
  b: './b.png',
  a_r: './a_r.png',
  a_l: './a_l.png'
};

let loadedImages = 0;
const numImages = Object.keys(sources).length;

for (let src in sources) {
  images[src] = new Image();
  images[src].src = sources[src];
  images[src].onload = () => {
    if (++loadedImages >= numImages) {
      const maxDim = Math.max(images.h.naturalWidth, images.h.naturalHeight) || 1000;
      canvas.width = maxDim * 1.5;
      canvas.height = maxDim * 1.5;
      requestAnimationFrame(render);
    }
  };
}

function render(timestamp) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  const fixedScale = 3.0;
  ctx.translate(canvas.width / 2, canvas.height / 2 + 300);
  ctx.scale(fixedScale, fixedScale);
  ctx.translate(-canvas.width / 2, -canvas.height / 2);

  const centerX = canvas.width / 2;
  const centerY = canvas.height / 2;
  const breath = Math.sin(timestamp / 500) * 2;

  const anchorX = images.h.naturalWidth / 2;
  const anchorY = images.h.naturalHeight / 2;

  // 各パーツの描画
  drawParts(images.b, centerX, centerY, offsetX * 5, offsetY * 3 + breath, 0, anchorX, anchorY);

  drawParts(images.a_r, centerX, centerY, offsetX * 8, offsetY * 4 + breath, offsetX * 0.03, anchorX, anchorY);
  drawParts(images.a_l, centerX, centerY, offsetX * 8, offsetY * 4 + breath, offsetX * 0.03, anchorX, anchorY);

  // --- 頭部表示判定（口パク ＋ 2秒に1回のまばたき） ---
  // 2000ms（2秒）周期の計算。先頭150ms間を「まばたき（目閉じ）」状態とする
  const isBlinking = (timestamp % 2000) < 150;
  let activeHead = images.h;

  if (isSpeaking) {
    // 再生中：0.15秒周期で口パク切り替え
    const talkCycle = Math.floor(timestamp / 150) % 2;
    if (talkCycle === 0) {
      activeHead = isBlinking ? images.h3 : images.h;  // 口開き（まばたき判定付き）
    } else {
      activeHead = isBlinking ? images.h4 : images.h2; // 口閉じ（まばたき判定付き）
    }
  } else {
    // 待機中：通常は h.png、2秒に1回 h3.png でまばたき
    activeHead = isBlinking ? images.h3 : images.h;
  }

  drawParts(activeHead, centerX, centerY, offsetX * 25, offsetY * 15 + breath * 0.5, offsetX * 0.06, anchorX, anchorY);

  ctx.restore();

  requestAnimationFrame(render);
}

function drawParts(img, posX, posY, shiftX, shiftY, angle, anchorX, anchorY) {
  if (!img || !img.complete) return;
  ctx.save();
  ctx.translate(posX + shiftX, posY + shiftY);
  ctx.rotate(angle);
  ctx.drawImage(img, -anchorX, -anchorY);
  ctx.restore();
}
</script>

</body>
</html>
