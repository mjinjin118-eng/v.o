<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>V.O System</title>
  <style>
    body {
      margin: 0;
      background-image: url('./玄関前.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      touch-action: none;
    }

    /* 1. パスワード確認ダイアログ */
    #startupDialog {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      background-image: url('./v.o System2.png');
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 200;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .startup-box {
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid #00f0ff;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.5);
      border-radius: 16px;
      padding: 30px 40px;
      text-align: center;
      color: #fff;
      font-family: sans-serif;
      max-width: 80vw;
    }

    .startup-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    .password-input {
      width: 80%;
      padding: 12px;
      font-size: 18px;
      text-align: center;
      border: 2px solid #00f0ff;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      outline: none;
      margin-bottom: 12px;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
    }

    .password-error {
      color: #ff4d4d;
      font-size: 14px;
      height: 20px;
      margin-bottom: 12px;
      font-weight: bold;
    }

    .launch-btn {
      padding: 12px 32px;
      font-size: 18px;
      font-weight: bold;
      color: #00f0ff;
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid #00f0ff;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
    }

    .launch-btn:active {
      background: #00f0ff;
      color: #000;
      transform: scale(0.95);
    }

    /* 2. 起動画面（スプラッシュ画面） */
    #splashScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      background-image: url('./v.o System.png');
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 100;
      display: none;
      opacity: 1;
      transition: opacity 0.8s ease;
    }

    canvas {
      background-color: transparent;
      max-width: 100vw;
      max-height: 100vh;
      touch-action: none;
    }
    .ui-container {
      position: absolute;
      top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }
    .btn {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid #fff;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .btn:active {
      transform: scale(0.95);
    }
    #status {
      color: white;
      background: rgba(0,0,0,0.6);
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 14px;
      pointer-events: none;
      text-align: center;
    }
  </style>
</head>
<body>

<!-- 1. パスワード確認ダイアログ -->
<div id="startupDialog">
  <div class="startup-box">
    <div class="startup-title">パスワードを入力してください</div>
    <input type="password" id="passInput" class="password-input" placeholder="Password" maxlength="10">
    <div id="passError" class="password-error"></div>
    <button class="launch-btn" id="launchBtn">システム起動</button>
  </div>
</div>

<!-- 2. 起動画面（v.o System.png） -->
<div id="splashScreen"></div>

<div class="ui-container">
  <button class="btn" id="startBtn">音声認識＆センサー開始</button>
  <div id="status">状態: 停止中（ボタンを押してください）</div>
</div>

<canvas id="vtuberCanvas"></canvas>

<script>
const startAudio = new Audio('./system_start.wav');
const clickAudio = new Audio('./fx.wav');

const startupDialog = document.getElementById('startupDialog');
const splashScreen = document.getElementById('splashScreen');
const launchBtn = document.getElementById('launchBtn');
const passInput = document.getElementById('passInput');
const passError = document.getElementById('passError');

function checkPasswordAndLaunch() {
  clickAudio.currentTime = 0;
  clickAudio.play().catch(err => console.log('SE再生エラー:', err));

  if (passInput.value === '036') {
    passError.textContent = '';
    startupDialog.style.display = 'none';
    splashScreen.style.display = 'block';

    startAudio.play().catch(err => console.log('音声再生エラー:', err));

    setTimeout(() => {
      splashScreen.style.opacity = '0';
      setTimeout(() => {
        splashScreen.style.display = 'none';
      }, 800);
    }, 8000);
  } else {
    passError.textContent = 'パスワードが違います';
    passInput.value = '';
  }
}

launchBtn.addEventListener('click', checkPasswordAndLaunch);
passInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') {
    checkPasswordAndLaunch();
  }
});

const canvas = document.getElementById('vtuberCanvas');
const ctx = canvas.getContext('2d');

let offsetX = 0;
let offsetY = 0;

// --- 拡大・移動用パラメータ ---
let scale = 1.6; // 全体表示スケールを最適化
let panX = 0;
let panY = 0;
let initialDistance = 0;
let initialScale = 1.6;
let startTouchX = 0;
let startTouchY = 0;
let initialPanX = 0;
let initialPanY = 0;
let lastTapTime = 0;

canvas.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    const now = Date.now();
    if (now - lastTapTime < 300) {
      scale = 1.6;
      panX = 0;
      panY = 0;
    }
    lastTapTime = now;

    startTouchX = e.touches[0].clientX;
    startTouchY = e.touches[0].clientY;
    initialPanX = panX;
    initialPanY = panY;
  } else if (e.touches.length === 2) {
    initialDistance = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    initialScale = scale;
  }
});

canvas.addEventListener('touchmove', (e) => {
  if (e.touches.length === 1) {
    const deltaX = e.touches[0].clientX - startTouchX;
    const deltaY = e.touches[0].clientY - startTouchY;
    panX = initialPanX + deltaX;
    panY = initialPanY + deltaY;
  } else if (e.touches.length === 2) {
    const currentDistance = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    if (initialDistance > 0) {
      const newScale = initialScale * (currentDistance / initialDistance);
      scale = Math.min(Math.max(newScale, 0.5), 4.0);
    }
  }
});

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
  scale = Math.min(Math.max(scale * zoomFactor, 0.5), 4.0);
}, { passive: false });


// --- 1. ボイス20個の読み込み ＆ 過去3回履歴管理 ---
const TOTAL_VOICES = 20;
const voiceSources = [];
for (let i = 1; i <= TOTAL_VOICES; i++) {
  voiceSources.push(`./voice${i}.wav`);
}

const voices = voiceSources.map(src => new Audio(src));
let currentVoice = null;
let historyIndices = [];
let isSpeaking = false;

// --- 2. 音声認識＆ジャイロ ---
const startBtn = document.getElementById('startBtn');
const statusDiv = document.getElementById('status');
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

let recognition = null;

startBtn.addEventListener('click', () => {
  clickAudio.currentTime = 0;
  clickAudio.play().catch(() => {});

  if (typeof window.DeviceOrientationEvent !== 'undefined') {
    window.addEventListener('deviceorientation', (e) => {
      const gamma = e.gamma || 0;
      const beta = e.beta || 0;
      offsetX = Math.min(Math.max(gamma / 30, -1), 1);
      offsetY = Math.min(Math.max((beta - 45) / 30, -1), 1);
    });
  }

  if (!SpeechRecognition) {
    statusDiv.textContent = 'エラー: お使いのブラウザは音声認識非対応です';
    return;
  }

  startBtn.style.display = 'none';
  initSpeechRecognition();
});

function initSpeechRecognition() {
  recognition = new SpeechRecognition();
  recognition.lang = 'ja-JP';
  recognition.continuous = true;
  recognition.interimResults = false;

  recognition.onstart = () => {
    if (!isSpeaking) {
      statusDiv.textContent = '話しかけてね';
      statusDiv.style.background = 'rgba(0, 150, 0, 0.6)';
    }
  };

  recognition.onresult = (event) => {
    if (isSpeaking) return;

    const results = event.results;
    for (let i = event.resultIndex; i < results.length; i++) {
      if (results[i].isFinal) {
        playRandomVoice();
      }
    }
  };

  recognition.onerror = (e) => {
    console.warn('音声認識通知:', e.error);
  };

  recognition.onend = () => {
    if (!isSpeaking) {
      setTimeout(() => {
        try {
          recognition.start();
        } catch (err) {}
      }, 300);
    }
  };

  try {
    recognition.start();
  } catch (e) {
    console.error(e);
  }
}

function playRandomVoice() {
  isSpeaking = true;
  try { recognition.stop(); } catch(e) {}

  if (currentVoice) {
    currentVoice.pause();
    currentVoice.currentTime = 0;
  }

  const availableIndices = [];
  for (let i = 0; i < voices.length; i++) {
    if (!historyIndices.includes(i)) {
      availableIndices.push(i);
    }
  }

  const pool = availableIndices.length > 0 ? availableIndices : Array.from({length: voices.length}, (_, i) => i);
  const randomIndex = pool[Math.floor(Math.random() * pool.length)];

  historyIndices.push(randomIndex);
  if (historyIndices.length > 3) {
    historyIndices.shift();
  }

  currentVoice = voices[randomIndex];

  statusDiv.textContent = '再生中...';
  statusDiv.style.background = 'rgba(0, 100, 200, 0.6)';

  currentVoice.onended = () => {
    isSpeaking = false;
    statusDiv.textContent = '話しかけてね';
    statusDiv.style.background = 'rgba(0, 150, 0, 0.6)';
    try { recognition.start(); } catch(e) {}
  };

  currentVoice.play().catch(err => {
    console.log('ボイス再生エラー:', err);
    isSpeaking = false;
    try { recognition.start(); } catch(e) {}
  });
}

// PC用マウスフォールバック
window.addEventListener('mousemove', (e) => {
  if (startBtn.style.display !== 'none') return;
  const rect = canvas.getBoundingClientRect();
  offsetX = ((e.clientX - rect.left) - canvas.width / 2) / (canvas.width / 2);
  offsetY = ((e.clientY - rect.top) - canvas.height / 2) / (canvas.height / 2);
});

// --- 画像描画ループ ---
const images = {};
const sources = {
  foot_l: './foot_l.png', foot_r: './foot_r.png', leg: './leg.png', body: './body.png',
  arm2_l: './arm2_l.png', arm1_l: './arm1_l.png', hand_l: './hand_l.png',
  arm2_r: './arm2_r.png', arm1_r: './arm1_r.png', hand_r: './hand_r.png', head: './head.png'
};

let loadedImages = 0;
const numImages = Object.keys(sources).length;

for (let src in sources) {
  images[src] = new Image();
  images[src].src = sources[src];
  images[src].onload = () => {
    if (++loadedImages >= numImages) {
      canvas.width = images.body.naturalWidth || 1000;
      canvas.height = images.body.naturalHeight || 1000;
      requestAnimationFrame(render);
    }
  };
}

function render(timestamp) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  // 画面の中央を起点に拡大・パン操作を適用
  ctx.translate(canvas.width / 2 + panX, canvas.height / 2 + panY);
  ctx.scale(scale, scale);
  ctx.translate(-canvas.width / 2, -canvas.height / 2);

  // キャラクターのパーツ合成基準点（中心）
  const centerX = canvas.width / 2;
  const centerY = canvas.height / 2 + 50; // 頭上が見切れないように少し下げる
  const breath = Math.sin(timestamp / 500) * 2;

  // 各パーツ描画時のアンカーポイントを個別に指定して中央に配置
  const anchorX = images.body.naturalWidth / 2;
  const anchorY = images.body.naturalHeight / 2;

  drawParts(images.foot_l, centerX, centerY, 0, 0, 0, anchorX, anchorY);
  drawParts(images.foot_r, centerX, centerY, 0, 0, 0, anchorX, anchorY);
  drawParts(images.leg, centerX, centerY, offsetX * 3, offsetY * 2, 0, anchorX, anchorY);
  drawParts(images.body, centerX, centerY, offsetX * 5, offsetY * 3 + breath, 0, anchorX, anchorY);

  drawParts(images.arm2_r, centerX, centerY, offsetX * 8, offsetY * 4 + breath, offsetX * 0.03, anchorX, anchorY);
  drawParts(images.arm1_r, centerX, centerY, offsetX * 12, offsetY * 6 + breath, offsetX * 0.08, anchorX, anchorY);
  drawParts(images.hand_r, centerX, centerY, offsetX * 15, offsetY * 8 + breath, offsetX * 0.08, anchorX, anchorY);

  drawParts(images.arm2_l, centerX, centerY, offsetX * 8, offsetY * 4 + breath, offsetX * 0.03, anchorX, anchorY);
  drawParts(images.arm1_l, centerX, centerY, offsetX * 12, offsetY * 6 + breath, offsetX * 0.05, anchorX, anchorY);
  drawParts(images.hand_l, centerX, centerY, offsetX * 15, offsetY * 8 + breath, offsetX * 0.08, anchorX, anchorY);

  drawParts(images.head, centerX, centerY, offsetX * 25, offsetY * 15 + breath * 0.5, offsetX * 0.06, anchorX, anchorY);

  ctx.restore();

  requestAnimationFrame(render);
}

function drawParts(img, posX, posY, shiftX, shiftY, angle, anchorX, anchorY) {
  if (!img || !img.complete) return;
  ctx.save();
  ctx.translate(posX + shiftX, posY + shiftY);
  ctx.rotate(angle);
  ctx.drawImage(img, -anchorX, -anchorY);
  ctx.restore();
}
</script>

</body>
</html>
