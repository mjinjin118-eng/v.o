<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>V.O System</title>
  <style>
    body {
      margin: 0;
      background-image: url('./玄関前.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      touch-action: none;
    }

    /* 1. 起動確認画面（背景：白） */
    #startupDialog {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #ffffff;
      z-index: 200;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .startup-box {
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid #00f0ff;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.5);
      border-radius: 16px;
      padding: 30px 40px;
      text-align: center;
      color: #fff;
      font-family: sans-serif;
      max-width: 80vw;
    }

    .startup-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    .launch-btn {
      padding: 14px 32px;
      font-size: 18px;
      font-weight: bold;
      color: #00f0ff;
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid #00f0ff;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
    }

    .launch-btn:active {
      background: #00f0ff;
      color: #000;
      transform: scale(0.95);
    }

    /* 2. 起動画面（スプラッシュ画面） */
    #splashScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      background-image: url('./v.o System.png');
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 100;
      display: none;
      opacity: 1;
      transition: opacity 0.8s ease;
    }

    canvas {
      background-color: transparent;
      max-width: 100vw;
      max-height: 100vh;
    }
    .ui-container {
      position: absolute;
      top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }
    .btn {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid #fff;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .btn:active {
      transform: scale(0.95);
    }
    #status {
      color: white;
      background: rgba(0,0,0,0.6);
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 14px;
      pointer-events: none;
      text-align: center;
    }
  </style>
</head>
<body>

<!-- 1. 確認ダイアログ -->
<div id="startupDialog">
  <div class="startup-box">
    <div class="startup-title">V.O Systemを起動しますか？</div>
    <button class="launch-btn" id="launchBtn">システム起動</button>
  </div>
</div>

<!-- 2. 起動画面（v.o System.png） -->
<div id="splashScreen"></div>

<div class="ui-container">
  <button class="btn" id="startBtn">🎤 常時音声認識＆センサー開始</button>
  <button class="btn" id="poseBtn" style="background: rgba(0, 100, 200, 0.8);">🙋 手を上げる / ポーズ切替</button>
  <div id="status">状態: 停止中（ボタンを押してください）</div>
</div>

<canvas id="vtuberCanvas"></canvas>

<script>
const startAudio = new Audio('./system_start.wav');
const startupDialog = document.getElementById('startupDialog');
const splashScreen = document.getElementById('splashScreen');
const launchBtn = document.getElementById('launchBtn');

// 「システム起動」ボタンを押したときの処理
launchBtn.addEventListener('click', () => {
  startupDialog.style.display = 'none';
  splashScreen.style.display = 'block';

  startAudio.play().catch(err => console.log('音声再生エラー:', err));

  setTimeout(() => {
    splashScreen.style.opacity = '0';
    setTimeout(() => {
      splashScreen.style.display = 'none';
    }, 800);
  }, 8000); // 8秒間表示
});

const canvas = document.getElementById('vtuberCanvas');
const ctx = canvas.getContext('2d');

let offsetX = 0;
let offsetY = 0;
let raiseHandMode = 0;

// --- 1. ボイス20個を自動生成して準備 ---
const TOTAL_VOICES = 20; // ボイスの総数
const voiceSources = [];
for (let i = 1; i <= TOTAL_VOICES; i++) {
  voiceSources.push(`./voice${i}.wav`);
}

const voices = voiceSources.map(src => new Audio(src));
let currentVoice = null;
let lastVoiceIndex = -1; // 直前に再生したボイスの番号を記録
let isSpeaking = false;

// --- 2. ポーズ切替ボタン ---
const poseBtn = document.getElementById('poseBtn');
poseBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  raiseHandMode = (raiseHandMode + 1) % 4;
});

// --- 3. 音声認識＆ジャイロ ---
const startBtn = document.getElementById('startBtn');
const statusDiv = document.getElementById('status');
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

let recognition = null;

startBtn.addEventListener('click', () => {
  if (typeof window.DeviceOrientationEvent !== 'undefined') {
    window.addEventListener('deviceorientation', (e) => {
      const gamma = e.gamma || 0;
      const beta = e.beta || 0;
      offsetX = Math.min(Math.max(gamma / 30, -1), 1);
      offsetY = Math.min(Math.max((beta - 45) / 30, -1), 1);
    });
  }

  if (!SpeechRecognition) {
    statusDiv.textContent = 'エラー: お使いのブラウザは音声認識非対応です';
    return;
  }

  startBtn.style.display = 'none';
  initSpeechRecognition();
});

function initSpeechRecognition() {
  recognition = new SpeechRecognition();
  recognition.lang = 'ja-JP';
  recognition.continuous = true;
  recognition.interimResults = false;

  recognition.onstart = () => {
    if (!isSpeaking) {
      statusDiv.textContent = '状態: 🟢 常に聴き取り中...（話しかけてね）';
      statusDiv.style.background = 'rgba(0, 150, 0, 0.6)';
    }
  };

  recognition.onresult = (event) => {
    if (isSpeaking) return;

    const results = event.results;
    for (let i = event.resultIndex; i < results.length; i++) {
      if (results[i].isFinal) {
        const text = results[i][0].transcript.trim();
        statusDiv.textContent = `反応: 「${text}」`;
        playRandomVoice();
      }
    }
  };

  recognition.onerror = (e) => {
    console.warn('音声認識通知:', e.error);
  };

  recognition.onend = () => {
    if (!isSpeaking) {
      setTimeout(() => {
        try {
          recognition.start();
        } catch (err) {}
      }, 300);
    }
  };

  try {
    recognition.start();
  } catch (e) {
    console.error(e);
  }
}

// 直前被り防止付きランダム再生（20個全対応）
function playRandomVoice() {
  isSpeaking = true;
  try { recognition.stop(); } catch(e) {}

  if (currentVoice) {
    currentVoice.pause();
    currentVoice.currentTime = 0;
  }

  // 直前と同じボイスが選ばれないようにルーレットを回す
  let randomIndex = Math.floor(Math.random() * voices.length);
  if (voices.length > 1) {
    while (randomIndex === lastVoiceIndex) {
      randomIndex = Math.floor(Math.random() * voices.length);
    }
  }
  lastVoiceIndex = randomIndex;

  currentVoice = voices[randomIndex];

  statusDiv.textContent = `🔊 ボイス${randomIndex + 1} 再生中...`;
  statusDiv.style.background = 'rgba(0, 100, 200, 0.6)';

  currentVoice.onended = () => {
    isSpeaking = false;
    statusDiv.textContent = '状態: 🟢 常に聴き取り中...';
    statusDiv.style.background = 'rgba(0, 150, 0, 0.6)';
    try { recognition.start(); } catch(e) {}
  };

  currentVoice.play().catch(err => {
    console.log('ボイス再生エラー:', err);
    isSpeaking = false;
    try { recognition.start(); } catch(e) {}
  });
}

// PC用マウスフォールバック
window.addEventListener('mousemove', (e) => {
  if (startBtn.style.display !== 'none') return;
  const rect = canvas.getBoundingClientRect();
  offsetX = ((e.clientX - rect.left) - canvas.width / 2) / (canvas.width / 2);
  offsetY = ((e.clientY - rect.top) - canvas.height / 2) / (canvas.height / 2);
});

// --- 画像描画ループ ---
const images = {};
const sources = {
  foot_l: './foot_l.png', foot_r: './foot_r.png', leg: './leg.png', body: './body.png',
  arm2_l: './arm2_l.png', arm1_l: './arm1_l.png', hand_l: './hand_l.png',
  arm2_r: './arm2_r.png', arm1_r: './arm1_r.png', hand_r: './hand_r.png', head: './head.png'
};

let loadedImages = 0;
const numImages = Object.keys(sources).length;

for (let src in sources) {
  images[src] = new Image();
  images[src].src = sources[src];
  images[src].onload = () => {
    if (++loadedImages >= numImages) {
      canvas.width = images.body.naturalWidth || 1000;
      canvas.height = images.body.naturalHeight || 1000;
      requestAnimationFrame(render);
    }
  };
}

function render(timestamp) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const centerX = canvas.width / 2;
  const centerY = canvas.height / 2;
  const breath = Math.sin(timestamp / 500) * 2;

  drawParts(images.foot_l, centerX, centerY, 0, 0, 0);
  drawParts(images.foot_r, centerX, centerY, 0, 0, 0);
  drawParts(images.leg, centerX, centerY, offsetX * 3, offsetY * 2, 0);
  drawParts(images.body, centerX, centerY, offsetX * 5, offsetY * 3 + breath, 0);

  const isRightUp = (raiseHandMode === 2 || raiseHandMode === 3);
  if (isRightUp) {
    const pivotX = centerX - 100, pivotY = centerY - 50, angle = Math.PI + (offsetX * 0.1);
    drawParts(images.arm2_r, pivotX, pivotY, offsetX * 5, offsetY * 3, angle, pivotX, pivotY);
    drawParts(images.arm1_r, pivotX, pivotY, offsetX * 5, offsetY * 3, angle, pivotX, pivotY);
    drawParts(images.hand_r, pivotX, pivotY, offsetX * 5, offsetY * 3, angle, pivotX, pivotY);
  } else {
    drawParts(images.arm2_r, centerX, centerY, offsetX * 8, offsetY * 4 + breath, offsetX * 0.03);
    drawParts(images.arm1_r, centerX, centerY, offsetX * 12, offsetY * 6 + breath, offsetX * 0.08);
    drawParts(images.hand_r, centerX, centerY, offsetX * 15, offsetY * 8 + breath, offsetX * 0.08);
  }

  const isLeftUp = (raiseHandMode === 1 || raiseHandMode === 3);
  if (isLeftUp) {
    const pivotX = centerX + 100, pivotY = centerY - 50, angle = -Math.PI + (offsetX * 0.1);
    drawParts(images.arm2_l, pivotX, pivotY, offsetX * 5, offsetY * 3, angle, pivotX, pivotY);
    drawParts(images.arm1_l, pivotX, pivotY, offsetX * 5, offsetY * 3, angle, pivotX, pivotY);
    drawParts(images.hand_l, pivotX, pivotY, offsetX * 5, offsetY * 3, angle, pivotX, pivotY);
  } else {
    drawParts(images.arm2_l, centerX, centerY, offsetX * 8, offsetY * 4 + breath, offsetX * 0.03);
    drawParts(images.arm1_l, centerX, centerY, offsetX * 12, offsetY * 6 + breath, offsetX * 0.05);
    drawParts(images.hand_l, centerX, centerY, offsetX * 15, offsetY * 8 + breath, offsetX * 0.08);
  }

  drawParts(images.head, centerX, centerY, offsetX * 25, offsetY * 15 + breath * 0.5, offsetX * 0.06);

  requestAnimationFrame(render);
}

function drawParts(img, posX, posY, shiftX, shiftY, angle, anchorX = canvas.width / 2, anchorY = canvas.height / 2) {
  if (!img || !img.complete) return;
  ctx.save();
  ctx.translate(posX + shiftX, posY + shiftY);
  ctx.rotate(angle);
  ctx.drawImage(img, -anchorX, -anchorY);
  ctx.restore();
}
</script>

</body>
</html>
